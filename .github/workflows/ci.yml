name: Sunrise Dental Clinic CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Compile application
        run: |
          mkdir -p out
          javac -cp "lib/mysql-connector-j-9.7.0.jar" \
            -d out \
            src/model/*.java \
            src/repository/*.java \
            src/ui/*.java

      - name: Compile JUnit tests
        run: |
          mkdir -p test-out
          javac \
            -cp "out:lib/mysql-connector-j-9.7.0.jar:lib/junit-platform-console-standalone-6.0.1.jar" \
            -d test-out \
            test/AppointmentTest.java

      - name: Run JUnit tests
        run: |
          java -jar \
            lib/junit-platform-console-standalone-6.0.1.jar \
            execute \
            --class-path "out:test-out:lib/mysql-connector-j-9.7.0.jar" \
            --select-class test.AppointmentTest